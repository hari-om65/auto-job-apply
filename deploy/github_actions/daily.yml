# Copy this file to .github/workflows/daily.yml in your PRIVATE runner repo (see deploy/github_actions/README.md).
name: Job runner

on:
  schedule:                       # UTC; every hour from 00:30 to 17:30 = 06:00 to 23:00 India time
    - cron: "30 0-17 * * *"
  workflow_dispatch:              # Actions tab -> Job runner -> Run workflow: fill these to apply to one job now
    inputs:
      job:
        description: "Apply to one job: paste the job post / description (leave empty to just check the channels)"
        required: false
        default: ""
      link:
        description: "Apply link or recruiter email (optional if it is in the post)"
        required: false
        default: ""
      ignore_filters:
        description: "I picked this job: ignore the batch, fit score and daily limit filters"
        type: boolean
        default: true

concurrency:                      # one run at a time, so the saved state is never overwritten
  group: job-runner
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: Asia/Kolkata
  DRY_RUN: ${{ vars.DRY_RUN || 'true' }}      # repository variable DRY_RUN=false turns real sending on
  JA_HEADLESS: "1"
  TG_SESSION_PATH: telegram_apply/tg_runner

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deploy/github_actions/requirements-runner.txt

      - run: pip install -r deploy/github_actions/requirements-runner.txt

      - name: Restore private files from secrets
        env:
          CONFIG_PY: ${{ secrets.CONFIG_PY }}
          BASE_RESUME_JSON: ${{ secrets.BASE_RESUME_JSON }}
          TG_RUNNER_SESSION_B64: ${{ secrets.TG_RUNNER_SESSION_B64 }}
          UI_SETTINGS_JSON: ${{ secrets.UI_SETTINGS_JSON }}
        run: python deploy/github_actions/make_files.py

      - name: Restore state (which posts were already handled)
        run: |
          git clone --quiet --branch state --single-branch "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/state 2>/dev/null \
            && cp /tmp/state/*.json /tmp/state/*.jsonl telegram_apply/ 2>/dev/null || echo "no saved state yet (first run)"

      - name: Run the pipeline
        env:                      # passed as variables, never pasted into the script, so job text cannot run as code
          JOB_TEXT: ${{ inputs.job }}
          JOB_LINK: ${{ inputs.link }}
          FORCE: ${{ inputs.ignore_filters }}
        run: python -W ignore -m telegram_apply.headless

      - name: Save state
        if: always()
        run: |
          rm -rf /tmp/st && mkdir /tmp/st && cd /tmp/st
          git init -q -b state
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q origin state 2>/dev/null && git reset -q --soft origin/state || true
          cd "$GITHUB_WORKSPACE"
          for f in state.json runner_state.json results.jsonl; do cp "telegram_apply/$f" /tmp/st/ 2>/dev/null || true; done
          tail -n 3000 telegram_apply/llm_cache.jsonl > /tmp/st/llm_cache.jsonl 2>/dev/null || true
          cd /tmp/st
          git config user.name "job-runner"; git config user.email "job-runner@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "state $(date -u +%FT%TZ)"
          git push -q origin state
